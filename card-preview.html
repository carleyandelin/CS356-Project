<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Preview — Hover Reveal</title>
<style>
  :root {
    --teal-tint:  #e8f5f3;
    --teal-base:  #c0ddda;
    --teal-shade: #2d7a75;
    --card-w: 218px;
    --card-r: 18px;
  }
  body {
    background: #f1f1f1;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 32px;
    padding: 40px 24px;
    margin: 0;
  }
  h2 { font-size: 14px; color: #555; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

  /* ── Photo card ── */
  .hot-card--photo {
    display: block;
    text-decoration: none;
    width: var(--card-w);
    aspect-ratio: 1;
    border-radius: var(--card-r);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    background: var(--teal-shade);
    transform: translateY(0) scale(1);
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    transition:
      transform .22s cubic-bezier(.25,.46,.45,.94),
      box-shadow .22s cubic-bezier(.25,.46,.45,.94);
    cursor: pointer;
  }
  .hot-card--photo:hover,
  .hot-card--photo:focus-visible {
    transform: translateY(-6px) scale(1.02);
    box-shadow:
      0 20px 48px rgba(0,0,0,.22),
      0  6px 16px rgba(0,0,0,.12);
    outline: none;
  }

  /* Full-bleed image */
  .card-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Gradient scrim — hidden at rest */
  .card-scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,.75) 0%,
      rgba(0,0,0,.38) 30%,
      rgba(0,0,0,0)   56%
    );
    opacity: 0;
    transition: opacity .22s ease;
  }
  .hot-card--photo:hover .card-scrim,
  .hot-card--photo:focus-visible .card-scrim { opacity: 1; }

  /* Text — hidden at rest */
  .card-text {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 18px 20px; z-index: 2;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .22s ease, transform .22s ease;
  }
  .hot-card--photo:hover .card-text,
  .hot-card--photo:focus-visible .card-text {
    opacity: 1;
    transform: translateY(0);
  }
  .card-name {
    font-size: 19px; font-weight: 900; color: #fff;
    line-height: 1.1; letter-spacing: -.02em;
    margin-bottom: 5px;
    text-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  .card-blurb {
    font-size: 10.5px; color: rgba(255,255,255,.85);
    line-height: 1.45; text-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
  <h2>Hover the card ↓</h2>
  <a class="hot-card--photo" href="#" tabindex="0">
    <img class="card-img"
         src="https://res.cloudinary.com/nxwrbcvt/image/upload/f_auto,q_auto/paddle_boarding"
         alt="Paddleboarding">
    <div class="card-scrim"></div>
    <div class="card-text">
      <p class="card-name">Paddleboarding</p>
      <p class="card-blurb">Balance on a board and move across calm water with a paddle.</p>
    </div>
  </a>
  <p style="font-size:12px;color:#888;">This is a standalone preview file — delete after approval.</p>
</body>
</html>
