<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hobby Atlas information architecture prototype" />
    <title>Hobby Atlas | Explore hobbies</title>
    <link rel="preconnect" href="https://res.cloudinary.com">
  <link rel="dns-prefetch" href="https://res.cloudinary.com">
  <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <a class="brand" href="#browse" aria-label="Hobby Atlas home" data-log="Hobby Atlas home" data-log-destination="browse">
          <img class="brand-mark" src="logo.png" alt="Hobby Atlas logo" />
          <span><strong>Hobby Atlas</strong></span>
        </a>

        <nav class="category-nav" aria-label="Activity categories"></nav>
        <div class="nav-search" id="nav-search">
          <button class="nav-search__icon-btn" id="nav-search-toggle" aria-label="Open search" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14" y2="14"/></svg>
          </button>
          <div class="nav-search__bar" id="nav-search-bar" hidden>
            <input class="nav-search__input" id="nav-search-input" type="search" placeholder="Search hobbies…" autocomplete="off" aria-label="Search hobbies" />
            <button class="nav-search__close" id="nav-search-close" aria-label="Close search" type="button">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg>
            </button>
          </div>
        </div>
      </header>
      <div class="hobby-ticker-wrap">
        <p class="banner-phrase" id="banner-phrase" aria-live="polite"></p>
      </div>

      <!-- Tree test task banner — shown only in ?test mode -->
      <div id="test-banner" class="test-banner" hidden></div>

      <main id="app" tabindex="-1"></main>

      <footer class="site-footer">
        <span>HOBBY ATLAS / PROTOTYPE V1</span>
        <span>Find a little joy in the everyday.</span>
      </footer>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
